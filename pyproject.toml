[project]
name = "giro"
version = "0.1.0"
description = "Experimental research prototype: single image to orbit video to cropped, VR-ready Gaussian splat"
readme = "README.md"
license = "MIT AND GPL-3.0-or-later"  # GPL: the ComfyUI nodes in src/giro/comfy_ext/
license-files = ["LICENSE", "src/giro/comfy_ext/LICENSE"]
authors = [
    { name = "Kevin Raymond" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
giro = "giro:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
direct = [
    "gsplat>=1.5.3",
    "lpips>=0.1.4",
]
# scripts/evaluate.py: LPIPS and DINOv2 scores (uv run --group eval scripts/evaluate.py ...)
eval = [
    "lpips",
    "torch",
    "transformers",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
